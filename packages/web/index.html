<!doctype html>
<html lang="zh-CN">
  <head>
    <!--
      插件客户端 bundle 把 `react` / `react/jsx-runtime` 声明为 external，
      靠这张 import map 解析到宿主单例（public/host-sdk/*.js）。
      必须是 head 的第一个元素：import map 只对"解析时尚未加载"的 module script 生效，
      Vite 构建时还会把它前移到第一个 module script 之前（见 docs/plugin-platform-plan.md D-8）。
      注意：映射的目标必须是**真实存在**的 shim，因此这里只列 react 与 react/jsx-runtime，
      不映射 react-dom / react-dom/client（插件不得自带框架）。
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "/host-sdk/react.js",
          "react/jsx-runtime": "/host-sdk/jsx-runtime.js"
        }
      }
    </script>
    <!--
      主题（浅色/深色）的**首帧应用**脚本，必须内联且同步。
      理由：React 要等 bundle 下载执行完才渲染，那时浏览器已经画过一帧白底了——
      深色模式用户会看到明显的白闪（FOUC）。内联脚本在 <head> 里同步执行，
      早于任何绘制，因此不会闪。

      与 src/lib/theme.ts 的约定（test/theme.test.ts 会校验两处一致）：
      - 存储键名 `geewiki-theme`；
      - 三态语义：'light' | 'dark' | 其它/缺失 = 跟随系统；
      - 脚本**最小化**：不引依赖、失败静默（try/catch）——主题脚本报错会阻塞解析，
        代价远大于收益。

      位置：刻意放在 import map **之后**，以保持"import map 是 head 第一个元素"
      这一不变量（插件 bundle 依赖它解析 react）。本脚本是 classic script，
      不影响 import map 与 module script 的相对顺序。
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('geewiki-theme')
          var choice = stored === 'light' || stored === 'dark' ? stored : null
          var resolved =
            choice ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          var root = document.documentElement
          if (choice) root.classList.add(choice)
          root.style.colorScheme = resolved
        } catch (e) {
          /* localStorage 被禁用（隐私模式）等：保持默认，不影响功能 */
        }
      })()
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GeeWiki —— AI-Native 插件化知识库" />
    <title>GeeWiki</title>
    <!--
      图标：内联 SVG（几何图形 + 品牌色 #2563eb，与 styles.css 的 --accent 一致）。
      刻意不用 emoji：emoji 的渲染随平台/字体而异，与"产品"气质也不符。
      图形语义：圆角方形徽标 + 三条递减排版的横线（文档/条目），小尺寸下仍可辨认。
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='%23ffffff'/%3E%3Crect x='8' y='14.5' width='16' height='3' rx='1.5' fill='%23ffffff' opacity='.72'/%3E%3Crect x='8' y='20' width='9' height='3' rx='1.5' fill='%23ffffff' opacity='.48'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
