name: 环境准备（pnpm + Node + 依赖）
description: 安装 pnpm 与 Node、按锁文件安装依赖

runs:
  using: composite
  steps:
    # 不显式指定 version：pnpm/action-setup 会读取 package.json 的
    # packageManager 字段（当前为 pnpm@11.7.0），避免两处版本号漂移。
    - name: 安装 pnpm
      uses: pnpm/action-setup@v6

    # setup-node 的 `cache: pnpm` 会调用 `pnpm store path` 来决定缓存目录。
    # pnpm-workspace.yaml 里的 storeDir 是**相对路径**（.pnpm-store），会解析到 runner
    # 的工作目录内，因此这里无需任何改写。
    # （历史上此处曾需要 sed 删掉写死的宿主机绝对路径；改为相对路径后已移除，
    #   原因见 docs/ci-cd.md 第 3 节。）
    - name: 安装 Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm

    - name: 安装依赖
      shell: bash
      run: pnpm install --frozen-lockfile
