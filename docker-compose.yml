# GeeWiki —— Docker Compose 部署编排（Compose V2 规范，不使用已废弃的 version 字段）
#
# 默认体验（SQLite，开箱即用）：
#   docker compose up -d --build      → http://localhost:3000
#   仅启动 geewiki-app；数据持久化在 ./data，无需任何外部数据库服务。
#
# 生产部署（启用 PostgreSQL 数据库插件）：
#   docker compose --profile production up -d --build
#   - 同时启动 postgres 服务，应用内将激活 @geewiki/db-pg 互斥插件（该插件尚在规划中）。
#   - 需先在 .env 中提供 DB_PASSWORD（本项目不提交 .env，避免泄露密钥，见 postgres 服务注释）。
#
# ⚠️ 首次运行前的目录权限（绑定挂载的属主必须与容器内用户一致）：
#   容器内以非 root 的 node 用户运行（默认 uid/gid = 1000）。若 ./data、./config、./plugins
#   尚不存在或属于其他用户，请先执行：
#     mkdir -p data config plugins && sudo chown -R 1000:1000 data config plugins
#   若你的宿主用户 id 不是 1000，可改为对齐自身（无需 sudo chown）：
#     GEEWIKI_UID=$(id -u) GEEWIKI_GID=$(id -g) docker compose up -d
#   详见 docs/deployment.md「目录权限」一节。
#
# 可用环境变量（均可写入 .env）：
#   GEEWIKI_HOST_PORT        宿主端口（默认 3000）；容器内端口固定 3000
#   GEEWIKI_HOST_DATA_DIR    数据目录宿主路径（默认 ./data）
#   GEEWIKI_HOST_CONFIG_DIR  配置目录宿主路径（默认 ./config）
#   GEEWIKI_HOST_PLUGINS_DIR 插件目录宿主路径（默认 ./plugins）
#   GEEWIKI_UID / GEEWIKI_GID 容器运行用户（默认 1000:1000，对应镜像内 node 用户）

services:
  geewiki-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: geewiki:latest
    # PID 1 交给 tini（负责信号转发与僵尸进程回收）；应用自身收到 SIGTERM 会优雅退出
    init: true
    # 非 root 运行：默认与镜像内 node 用户（1000:1000）一致，可用 GEEWIKI_UID/GID 对齐宿主
    user: "${GEEWIKI_UID:-1000}:${GEEWIKI_GID:-1000}"
    ports:
      - "${GEEWIKI_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # 以下为 packages/server/src/index.ts 实际读取的环境变量
      # （GEEWIKI_PORT / GEEWIKI_DATA_DIR / GEEWIKI_CONFIG_DIR / GEEWIKI_PLUGINS_DIR / GEEWIKI_WEB_DIST），
      # 取值与下方挂载点一致；插件清单文件名固定为 <config 目录>/plugins.base.json（本机 live，
      # 首次保存配置时生成）、plugins.base.example.json（随版本发布的默认值模板）与
      # plugins.session.json，无独立环境变量。
      # ⚠️ 挂载会**覆盖**镜像里的模板：宿主 config 目录若为空，容器会读到空清单 ⇒ 没有任何插件被
      # 激活 ⇒ HTTP 不监听 ⇒ 静默重启循环。首次部署请让宿主目录里至少有一份 plugins.base.json
      # （通常从 config/plugins.base.example.json 复制）。
      GEEWIKI_PORT: 3000
      GEEWIKI_DATA_DIR: /app/data            # SQLite 数据库与 crash.marker 所在目录
      GEEWIKI_CONFIG_DIR: /app/config        # 基础层（live + 模板）/ 会话层插件清单目录
      # 外部插件发现根：必须是绝对路径（相对路径在部署树里会回退到 process.cwd()，
      # 见 Dockerfile 中该变量的注释）。与下方 ./plugins 挂载的目标路径保持一致。
      GEEWIKI_PLUGINS_DIR: /app/plugins
      # 前端静态产物目录：显式给出，避免依赖 cwd；由镜像构建阶段生成到该路径
      GEEWIKI_WEB_DIST: /app/packages/web/dist
    volumes:
      - "${GEEWIKI_HOST_DATA_DIR:-./data}:/app/data"          # SQLite 数据库、crash.marker 等运行时数据（持久化）
      - "${GEEWIKI_HOST_PLUGINS_DIR:-./plugins}:/app/plugins" # 外部插件发现根：每个子目录一个插件（清单见 package.json 的 geewiki 键或 geewiki.manifest.json）；插件不从镜像内打包，只来自此挂载
      - "${GEEWIKI_HOST_CONFIG_DIR:-./config}:/app/config"    # 插件清单目录（live plugins.base.json / 模板 plugins.base.example.json / plugins.session.json / secrets.json）。**空目录会覆盖镜像里的模板** ⇒ 读到空清单 ⇒ HTTP 不监听，详见上方 ⚠️
    restart: unless-stopped
    # 健康检查沿用镜像内 HEALTHCHECK（GET /api/health，30s 间隔）：
    #   docker compose ps  可看到 healthy / unhealthy 状态。
    # 自愈逻辑（已由应用实现；见 packages/manager/src/index.ts、packages/server/src/index.ts）：
    #   - 仅在三种情形写入 <data 目录>/crash.marker：未捕获异常 / 未处理 Promise 拒绝 / startServer() 抛错；
    #   - HTTP 监听失败（如端口被占用）不属于上述情形：进程以退出码 1 退出，但不写标记；
    #   - 重启后启动阶段检测到该标记，即跳过会话层（Session Layer）装配并删除标记，
    #     自动回滚至基础层（Base Layer）稳定状态，避免坏插件造成反复崩溃；
    #   - 优雅退出（SIGINT/SIGTERM 且插件全部卸载成功）会删除该标记；
    #   - 看门狗熔断时先清空会话层清单文件，再以退出码 1 退出。

  postgres:
    image: postgres:15
    profiles: ["production"]   # 仅当启用 PostgreSQL 插件（--profile production）时才启动该服务
    # 不映射宿主端口：仅在同一 Compose 网络内以 postgres:5432 供 geewiki-app 访问
    environment:
      POSTGRES_DB: geewiki
      POSTGRES_USER: geewiki
      # `:-` 兜底：未设置 DB_PASSWORD 时不再让每条 compose 命令都打印
      # "The DB_PASSWORD variable is not set" 告警（该变量只在启用
      # --profile production 时才真正被用到）。
      # 未提供时为空口令，postgres 官方镜像会拒绝以空口令初始化并明确报错退出
      # （安全失败，不会产生弱口令实例）；启用该 profile 前必须在 .env 中提供强口令。
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:   # PostgreSQL 数据卷（named volume）
